name: 1 - Mattina (ingressi)

on:
  schedule:
    # UTC. Parte in anticipo e il bot aspetta da solo le 9:45 di New York (vale sia con l'ora legale sia senza).
    - cron: "17 12 * * 1-5"
    - cron: "47 13 * * 1-5"   # riserva, se GitHub salta la prima
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.main morning
      - name: Salva il diario
        if: always()
        run: |
          git config user.name "orb-bot"
          git config user.email "orb-bot@users.noreply.github.com"
          git add journal || true
          git diff --cached --quiet || (git commit -m "Diario: ingressi $(date -u +%F)" && git pull --rebase && git push)
