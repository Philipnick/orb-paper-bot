name: 0 - Verifica collegamento

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/**", "config.json", "tests/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test offline
        run: python -m unittest discover -s tests -t . -v
      - name: Verifica chiavi e conto paper
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.main check
