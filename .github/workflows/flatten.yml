name: 2 - Pomeriggio (chiusura e report)

on:
  schedule:
    # UTC. Il bot aspetta fino a 10 minuti prima della chiusura (anche nei giorni a orario ridotto).
    - cron: "37 16 * * 1-5"
    - cron: "37 18 * * 1-5"   # riserva
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatten
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.main flatten
      - name: Salva il diario
        if: always()
        run: |
          git config user.name "orb-bot"
          git config user.email "orb-bot@users.noreply.github.com"
          git add journal || true
          git diff --cached --quiet || (git commit -m "Diario: chiusura $(date -u +%F)" && git pull --rebase && git push)
